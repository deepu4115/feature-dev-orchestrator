        - user-service/src/main/java/com/example/user/security/SecurityConfig.java
        - order-service/src/main/java/com/example/order/security/SecurityConfig.java
      affected_tasks:
        - T001
        - T004
    - id: A002
      statement: The cart and order flows will stay within the existing service ownership model, with product availability checked through the product service and local persistence owned by order-service.
      confidence: HIGH
      impact: HIGH
      evidence:
        - order-service/src/main/java/com/example/order/infrastructure/integration/ProductFeignClient.java
        - order-service/src/main/java/com/example/order/api/OrderController.java
        - product-service/src/main/java/com/example/product/api/controller/ProductController.java
      affected_tasks:
