requirements:
    - id: R001
      description: Authenticated cart and order operations must derive identity from validated JWT claims instead of accepting arbitrary usernames or user ids.
      tasks:
        - T001
    - id: R002
      description: Authenticated users must be able to fetch the current cart, including cart items, product display data, and a computed total.
      tasks:
        - T002
    - id: R003
      description: Users must be able to retrieve only their own order history; order access must be scoped to the current authenticated user.
      tasks:
        - T003
    - id: R004
      description: Order creation must validate the cart, load products, reject empty carts, reserve or decrement stock, persist order items, and clear only the purchased entries after success.
      tasks:
        - T004
        - T005
        - T008
    - id: R005
      description: The system must define and document a partial-stock failure strategy for synchronous reservation and rollback behavior in the demo scope.
      tasks:
        - T004
        - T005
    - id: R006
      description: Order and cart persistence must be transaction-safe, with reliable order item persistence and a clear local transaction boundary.
      tasks:
        - T004
        - T008
    - id: R007
      description: Standardized HTTP status codes and error payloads must be implemented across the business services to replace generic exception behavior.
      tasks:
        - T002
        - T003
        - T006
    - id: R008
      description: Input validation and authorization enforcement must be added for product mutation, user mutation, cart operations, and order status transitions using Bean Validation and role/ownership checks.
      tasks:
        - T001
        - T002
        - T003
        - T006
    - id: R009
      description: Gateway routing and authentication metadata must be explicit and consistent with the Consul basePath contract, including route discovery and auth behavior.
      tasks:
        - T006
        - T007
    - id: R010
      description: Required external configuration and runtime dependencies must be documented and validated without exposing secret values.
      tasks:
        - T001
        - T007
    - id: R011
      description: The demo must include focused tests for cart logic, order creation, authentication, and an end-to-end purchase flow covering persistence and cart clearing.
      tasks:
        - T004
        - T005
        - T008
